<body>
<header class="appbar"><div class="brand">AGENT / 推理与协作</div><div class="bar-right"><span id="chapterLabel"></span><button id="tocBtn">目录</button><button id="notesBtn">讲师备注</button><button id="fullBtn">全屏</button><button id="helpBtn" aria-label="快捷键帮助">?</button></div></header>
<div id="viewport"><main id="stage" aria-label="培训演示文稿">__SLIDES__</main></div>
<footer class="bottom-bar"><button id="prevBtn" aria-label="上一页">← 上一页</button><span id="pageNumber" aria-live="polite"></span><button id="nextBtn" aria-label="下一页">下一页 →</button><span class="shortcuts">← → 翻页 · N 讲师备注 · O 目录 · F 全屏 · ? 帮助</span></footer><div class="progress" id="progress"></div>
<dialog id="tocDialog"><header><h2>课程目录</h2><button data-close="tocDialog">关闭</button></header><div id="tocList"></div></dialog>
<dialog id="notesDialog"><header><h2 id="notesTitle">讲师备注</h2><button data-close="notesDialog">关闭</button></header><div id="notesText"></div><div id="notesSources"></div></dialog>
<dialog id="helpDialog"><header><h2>演示操作</h2><button data-close="helpDialog">关闭</button></header><div class="help-grid">← / ↑ / PageUp：上一页<br>→ / ↓ / 空格 / PageDown：下一页<br>Home / End：第一页 / 最后一页<br>O：目录　N：讲师备注　F：全屏<br>Esc：关闭弹窗或退出全屏<br>Ctrl+P：打印讲义（每页一张）<br><br>第 5 页：点击演示 ReAct 循环<br>第 12 页：互动判断题<br>第 29 页：本地 Python 运行、教学回放、JSON 轨迹导入<br><br>讲师备注会显示在当前屏幕，投影时请注意观众可见。</div></dialog>
<script>
'use strict';
const COURSE=__COURSE__;
const REPLAY=__REPLAY__;
const $=s=>document.querySelector(s);
let current=0, phase=-1, trace=null, eventIndex=-1, playback=null;
function fit(){const r=$('#viewport').getBoundingClientRect();document.documentElement.style.setProperty('--stage-scale',Math.max(.1,Math.min((r.width-24)/1440,(r.height-18)/810)));}
function stopPlayback(){if(playback){clearInterval(playback);playback=null;}$('#playDemo').textContent='自动播放';}
function showSlide(n, updateHash=true){current=Math.max(0,Math.min(COURSE.length-1,n));document.querySelectorAll('.slide').forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',i===current?'false':'true');s.inert=i!==current;});$('#chapterLabel').textContent=COURSE[current].chapter;$('#pageNumber').textContent=`${current+1} / ${COURSE.length}`;$('#progress').style.width=`${(current+1)/COURSE.length*100}%`;$('#prevBtn').disabled=current===0;$('#nextBtn').disabled=current===COURSE.length-1;document.title=`${current+1}. ${COURSE[current].title} · Agent 实战课`;if(updateHash)history.replaceState(null,'',`#${current+1}`);document.querySelectorAll('#tocList button').forEach((b,i)=>b.setAttribute('aria-current',String(i===current)));if(current!==28)stopPlayback();}
function openDialog(id){const d=$('#'+id);if(d.open){d.close();return;}d.showModal();}
function notes(){const s=COURSE[current];$('#notesTitle').textContent=`${current+1} / ${s.title}`;$('#notesText').textContent=s.notes;$('#notesSources').replaceChildren();s.sources.forEach(src=>{const a=document.createElement('a');a.href=src[1];a.target='_blank';a.rel='noopener';a.textContent=src[0]+' ↗';$('#notesSources').append(a);});openDialog('notesDialog');}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('#fullBtn').textContent='请使用浏览器全屏';}}
COURSE.forEach((s,i)=>{const b=document.createElement('button');b.textContent=`${String(i+1).padStart(2,'0')}　${s.title}`;b.onclick=()=>{showSlide(i);$('#tocDialog').close();};$('#tocList').append(b);});
$('#prevBtn').onclick=()=>showSlide(current-1);$('#nextBtn').onclick=()=>showSlide(current+1);$('#tocBtn').onclick=()=>openDialog('tocDialog');$('#notesBtn').onclick=notes;$('#fullBtn').onclick=fullscreen;$('#helpBtn').onclick=()=>openDialog('helpDialog');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select'))return;if(document.querySelector('dialog[open]'))return;if(['BUTTON','A'].includes(e.target.tagName)&&[' ','Enter'].includes(e.key))return;const actions={'ArrowRight':()=>showSlide(current+1),'ArrowDown':()=>showSlide(current+1),'PageDown':()=>showSlide(current+1),' ':()=>showSlide(current+1),'ArrowLeft':()=>showSlide(current-1),'ArrowUp':()=>showSlide(current-1),'PageUp':()=>showSlide(current-1),'Home':()=>showSlide(0),'End':()=>showSlide(COURSE.length-1),'o':()=>openDialog('tocDialog'),'n':notes,'f':fullscreen,'?':()=>openDialog('helpDialog')};const a=actions[e.key]||actions[e.key.toLowerCase()];if(a){e.preventDefault();a();}});
window.addEventListener('resize',fit);window.addEventListener('hashchange',()=>showSlide((parseInt(location.hash.slice(1),10)||1)-1,false));
$('#reactNext').onclick=()=>{phase=(phase+1)%3;document.querySelectorAll('[data-phase]').forEach((n,i)=>n.classList.toggle('current',i===phase));$('#reactExplain').textContent=['Thought 摘要：先检查真实字段，再决定怎样计算。','Action：inspect({}) → 运行时读取本地 CSV。','Observation：8 行；字段包含 gross、refund、status。'][phase];$('#reactNext').textContent='下一步';};
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-answer]').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(b.dataset.answer==='b'?'correct':'wrong');$('#quizFeedback').textContent={a:'A 没有利用错误证据；相同参数的重试仍会失败。',b:'正确。结合实际字段和业务口径修正调用，再用工具结果验收。',c:'C 没有计算依据，不能用估计值替代工具返回。'}[b.dataset.answer];});
function validTrace(v){return v&&typeof v==='object'&&Array.isArray(v.events)&&v.events.length>0&&v.events.length<=500&&['simulation','ollama'].includes(v.mode)&&typeof v.run_id==='string'&&['completed','failed','stopped'].includes(v.status)&&v.events.every(e=>e&&typeof e.id==='string'&&typeof e.actor==='string'&&typeof e.kind==='string'&&e.payload&&typeof e.payload==='object');}
function loadTrace(value,label){if(!validTrace(value))throw new Error('轨迹格式无效：需要本课程 Demo 导出的 JSON。');stopPlayback();trace=value;eventIndex=-1;$('#eventList').replaceChildren();value.events.forEach((e,i)=>{const b=document.createElement('button');b.textContent=`${e.id} · ${e.actor} / ${e.kind}`;b.onclick=()=>selectEvent(i);$('#eventList').append(b);});$('#demoStatus').textContent=`${label}｜${value.mode==='simulation'?'规则模拟决策 + 真实工具':'Ollama 模型模式'}｜状态：${value.status}｜${value.events.length} 个事件`;$('#stepDemo').disabled=false;$('#playDemo').disabled=false;$('#downloadTrace').disabled=false;selectEvent(0);}
function selectEvent(i){if(!trace)return;eventIndex=Math.min(trace.events.length-1,Math.max(0,i));const e=trace.events[eventIndex];$('#eventHeading').textContent=`${e.id} · ${e.actor} · ${e.kind} · plan v${e.plan_version??'?'}`;$('#eventPayload').textContent=JSON.stringify(e.payload,null,2);document.querySelectorAll('#eventList button').forEach((b,j)=>{b.classList.toggle('selected',j===eventIndex);if(j===eventIndex)b.scrollIntoView({block:'nearest'});});$('#eventCounter').textContent=`${eventIndex+1} / ${trace.events.length}`;$('#stepDemo').disabled=eventIndex===trace.events.length-1;if(eventIndex===trace.events.length-1)stopPlayback();}
$('#replayDemo').onclick=()=>loadTrace(REPLAY[$('#inject').checked?'failure':'normal'],'已验证教学轨迹回放（非本次运行）');
$('#stepDemo').onclick=()=>selectEvent(eventIndex+1);
$('#playDemo').onclick=()=>{if(playback){stopPlayback();return;}if(!trace)return;if(eventIndex===trace.events.length-1)selectEvent(0);$('#playDemo').textContent='暂停播放';playback=setInterval(()=>selectEvent(eventIndex+1),1600);};
$('#runDemo').onclick=async()=>{if(!/^https?:$/.test(location.protocol)){ $('#demoStatus').textContent='请先运行 python demo/server.py，再打开 http://127.0.0.1:8765；或点击“加载教学回放”。';return;}stopPlayback();$('#runDemo').disabled=true;$('#demoStatus').textContent='正在运行本地 Python；结束后可逐事件回放。';try{const response=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inject_failure:$('#inject').checked}),signal:AbortSignal.timeout(15000)});if(!response.ok)throw new Error(`HTTP ${response.status}`);const value=await response.json();loadTrace(value,'本次 Python 运行结果');}catch(e){$('#demoStatus').textContent=`运行未完成：${e.message}。请确认用 demo/server.py 启动；可切换教学回放。`;}finally{$('#runDemo').disabled=false;}};
$('#traceFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2_000_000)throw new Error('文件大于 2 MB');const value=JSON.parse(await file.text());loadTrace(value,'导入的历史轨迹（非本次运行；文件声明未经重新验收）');}catch(err){$('#demoStatus').textContent='导入失败：'+err.message;}e.target.value='';};
$('#downloadTrace').onclick=()=>{if(!trace)return;const blob=new Blob([JSON.stringify(trace,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=`${trace.run_id}-trace.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
showSlide((parseInt(location.hash.slice(1),10)||1)-1);fit();
</script>
</body></html>
